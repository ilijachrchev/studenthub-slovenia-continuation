services:
  db:
    image: postgres:16
    container_name: studenthub-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-SISIII2026_89241041}
      POSTGRES_USER: ${DB_USER:-studenti}
      POSTGRES_PASSWORD: ${DB_PASS:-studentipass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-studenti} -d ${DB_DATABASE:-SISIII2026_89241041}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s

  backend:
    build: ./backend
    container_name: studenthub-backend
    ports:
      - "30011:30011"
    environment:
      NODE_ENV: production
      DB_CLIENT: pg
      DB_HOST: db
      DB_USER: ${DB_USER:-studenti}
      DB_PASS: ${DB_PASS:-studentipass}
      DB_DATABASE: ${DB_DATABASE:-SISIII2026_89241041}
      DB_PORT: 5432
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      RUN_MIGRATIONS_ON_STARTUP: "true"
      RUN_SEEDS_ON_STARTUP: "false"
      LOG_LEVEL: info
      PORT: 30011
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:30011/api/ready').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
